<!doctype html>
<html lang="ko">
<head>
  <!-- 한글 문서와 모바일 화면 크기를 브라우저에 알려줍니다. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f2">
  <title>구독 트래커</title>
  <!-- 화면 모양(CSS)과 동작(JavaScript)을 연결합니다. -->
  <link rel="stylesheet" href="css/style.css">
  <!-- logic.js는 export가 없는 일반 스크립트라 먼저 불러와야 계산 함수를 사용할 수 있습니다. -->
  <script src="js/logic.js" defer></script>
  <!-- 화면을 그리는 코드와 입력/저장 코드는 계산 함수 다음에 실행합니다. -->
  <script src="js/ui.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <!-- 페이지 어디서든 보이는 서비스 이름 영역입니다. -->
  <header class="topbar">
    <a class="brand" href="#top" aria-label="구독 트래커 홈">
      <span class="brand-mark" aria-hidden="true">₩</span>
      <span>구독 트래커</span>
    </a>
    <span class="topbar-note">매달 나가는 돈, 한눈에</span>
  </header>

  <!-- 실제 구독 관리 화면의 모든 콘텐츠를 담습니다. -->
  <main id="top" class="page-shell">
    <!-- 페이지 제목과 오늘 날짜를 표시합니다. 날짜는 JavaScript가 채웁니다. -->
    <section class="page-heading" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">MY SUBSCRIPTIONS</p>
        <h1 id="page-title">구독 관리</h1>
      </div>
      <p id="today-label" class="today-label"></p>
    </section>

    <!-- 아래 숫자들은 구독 데이터가 바뀔 때마다 JavaScript가 갱신합니다. -->
    <section class="summary-grid" aria-label="구독 요약">
      <article class="summary-item summary-monthly">
        <p class="summary-label">월 합계</p>
        <p id="monthly-total" class="summary-value">0원</p>
        <p class="summary-detail">월 기준 지출</p>
      </article>
      <article class="summary-item summary-yearly">
        <p class="summary-label">연간 합계</p>
        <p id="yearly-total" class="summary-value">0원</p>
        <p class="summary-detail">월 합계 × 12개월</p>
      </article>
      <article class="summary-item summary-upcoming">
        <p class="summary-label">이번 주 결제 예정</p>
        <p id="upcoming-total" class="summary-value">0건</p>
        <p id="upcoming-detail" class="summary-detail">예정된 결제가 없습니다</p>
      </article>
    </section>

    <!-- 넓은 화면에서는 목록과 입력 도구를 나란히, 좁은 화면에서는 세로로 배치합니다. -->
    <div class="content-grid">
      <!-- 구독 카드가 JavaScript로 추가되는 자리입니다. -->
      <section class="subscriptions-section" aria-labelledby="subscriptions-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">YOUR SERVICES</p>
            <h2 id="subscriptions-title">내 구독 <span id="subscription-count" class="count-badge">0</span></h2>
          </div>
          <span class="section-caption">가까운 결제일 순</span>
        </div>
        <div id="subscription-list" class="subscription-list" aria-live="polite"></div>
      </section>

      <!-- 구독 추가/수정 폼과 카테고리 통계를 모아 둡니다. -->
      <aside class="side-column">
        <section class="form-section" aria-labelledby="form-title">
          <div class="section-heading form-heading">
            <div>
              <p class="eyebrow">ADD A SERVICE</p>
              <h2 id="form-title">새 구독 추가</h2>
            </div>
          </div>
          <!-- name 속성은 JavaScript가 폼 값을 읽을 때 사용합니다. required는 필수 입력 표시입니다. -->
          <form id="subscription-form">
            <label class="field">
              <span>구독 이름</span>
              <input id="name" name="name" type="text" placeholder="예: 영상 스트리밍" maxlength="40" required>
            </label>
            <div class="field-row">
              <label class="field">
                <span>결제 금액</span>
                <input id="amount" name="amount" type="number" min="1" step="1" placeholder="13,500" required>
              </label>
              <label class="field">
                <span>결제 주기</span>
                <select id="cycle" name="cycle">
                  <option value="monthly">매월</option>
                  <option value="yearly">매년</option>
                </select>
              </label>
            </div>
            <div class="field-row">
              <label class="field">
                <span>카테고리</span>
                <select id="category" name="category" required>
                  <option value="영상">영상</option>
                  <option value="음악">음악</option>
                  <option value="생산성">생산성</option>
                  <option value="클라우드">클라우드</option>
                  <option value="생활">생활</option>
                  <option value="기타">기타</option>
                </select>
              </label>
              <label class="field">
                <span>다음 결제일</span>
                <input id="next-payment-date" name="nextPaymentDate" type="date" required>
              </label>
            </div>
            <div class="form-actions">
              <button id="cancel-edit" class="button button-quiet" type="button" hidden>취소</button>
              <button id="submit-button" class="button button-primary" type="submit">구독 추가 <span aria-hidden="true">+</span></button>
            </div>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
          </form>
        </section>

        <!-- 카테고리별 월 금액과 전체 중 차지하는 비율을 표시합니다. -->
        <section class="categories-section" aria-labelledby="categories-title">
          <div class="section-heading category-heading">
            <div>
              <p class="eyebrow">MONTHLY BREAKDOWN</p>
              <h2 id="categories-title">카테고리별 비중</h2>
            </div>
          </div>
          <div id="category-breakdown" class="category-breakdown"></div>
        </section>
      </aside>
    </div>
  </main>

  <!-- 보조 기술이 화면을 읽을 때 동적 갱신을 알 수 있도록 문서에 표시합니다. -->
  <script>
    document.documentElement.classList.add('js-ready');
  </script>
</body>
</html>
